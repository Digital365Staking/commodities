name: collect

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 05:17 UTC (GitHub peut démarrer quelques minutes en retard)
  workflow_dispatch:        # lancement manuel possible à tout moment

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend
        shell: bash

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_AGENT: ${{ vars.USER_AGENT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Secret DATABASE_URL is missing"; exit 1; }
          [ -n "$USER_AGENT" ]   || { echo "::error::Variable USER_AGENT is missing"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r ../requirements.txt
          fi

      - name: Run migrations
        run: python -m app.migrate

      - name: Collect data
        run: python -m app.collect

      - name: Normalize reference data
        if: always()
        run: python -m app.normalize
