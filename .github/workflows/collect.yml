name: collect

on:
  schedule:
    - cron: "17 5 * * *"   # tous les jours à 05:17 UTC (GitHub peut démarrer quelques minutes en retard)
  workflow_dispatch:        # lancement manuel possible à tout moment

# Droits minimaux : le job n'écrit rien dans le dépôt
permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Ne pas lancer sur les forks (ils n'ont pas tes secrets)
    if: github.repository == github.event.repository.full_name
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend
        shell: bash

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_AGENT: ${{ vars.USER_AGENT }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret DATABASE_URL is missing"; exit 1; fi
          if [ -z "$USER_AGENT" ]; then echo "::error::Variable USER_AGENT is missing"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"   # marche que le fichier soit à la racine ou dans backend/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -r ../requirements.txt
          fi

      - name: Run migrations
        run: python -m app.migrate

      - name: Collect data
        run: python -m app.collect

      # S'exécute même si la collecte a échoué, pour normaliser ce qui a déjà été stocké
      - name: Normalize reference data
        if: always()
        run: python -m app.normalize
